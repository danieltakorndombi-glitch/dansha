<title>DANSHA Learning</title>
<style>
:root{--bl:#0A7AFF;--bl2:#4FC3F7;--bg:#F2F4F8;--card:#fff;--tx:#0B1220;--tx2:#5B6575;--sep:rgba(60,70,90,.14);--ok:#13875A;--no:#D6402B;--gold:#E0A100;--glass:rgba(255,255,255,.62);--gb:rgba(255,255,255,.6);--sh:0 8px 30px rgba(10,30,70,.10);color-scheme:light}
:root[data-t=dark]{--bl:#3B97FF;--bg:#06090F;--card:#121826;--tx:#F3F6FB;--tx2:#A0ABBD;--sep:rgba(255,255,255,.12);--ok:#3DD598;--no:#FF7A66;--gold:#FFC83D;--glass:rgba(26,32,48,.6);--gb:rgba(255,255,255,.14);--sh:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:500 17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.ic{flex:none;vertical-align:middle}
#main{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 112px) max(18px,env(safe-area-inset-right,0px))}
#main.tk{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 200px)}
#main.in>*{animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes rec{50%{box-shadow:0 0 0 12px rgba(214,64,43,.18)}}
@keyframes dot{0%,80%,100%{opacity:.35}40%{opacity:1}}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px}h2{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}h3{font-size:19px;margin:20px 0 10px}
.sub{color:var(--tx2);font-size:15px;font-weight:500}.c{text-align:center}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.glass,.tabs,.sheet,#fb{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--gb)}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;width:100%;min-height:56px;background:none;border:0;border-bottom:1px solid var(--sep);text-align:left}.row:last-child{border:0}.row b{display:block;font-weight:600}
.hero{background:linear-gradient(135deg,var(--bl),#3A5BFF);color:#fff;padding:20px;border-radius:26px;margin-bottom:14px;box-shadow:0 12px 30px rgba(10,122,255,.3)}.hero .sub{color:rgba(255,255,255,.85)}.hero b{font-size:22px;display:block;margin:2px 0 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border:0;border-radius:16px;background:var(--bl);color:#fff;font-weight:700;transition:transform .12s,opacity .2s}.btn:active:not(:disabled){transform:scale(.97)}.btn:disabled{opacity:.4}.btn.ghost{background:none;color:var(--bl)}.hero .btn{background:#fff;color:#0A56C8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--card);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--sh)}.stat b{display:block;font-size:22px}.stat .ic{color:var(--gold)}
.pg{height:8px;border-radius:4px;background:var(--sep);overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:var(--bl);border-radius:4px;transition:width .5s}
.week{display:flex;justify-content:space-between;padding:6px 4px}.week div{text-align:center;font-size:12px;color:var(--tx2)}.week i{display:block;width:26px;height:26px;border-radius:50%;background:var(--sep);margin:0 auto 4px}.week .on i{background:var(--bl)}

(function initTabsDrag(){

function detectSentiment(t){
  if(/\b(happy|great|awesome|love|good|fine|excited|amazing|wonderful|nice|cool|fun)\b/i.test(t))return"pos";
  if(/\b(sad|tired|angry|bad|stressed|worried|nervous|hate|terrible|awful|sick|lonely|bored)\b/i.test(t))return"neg";
  return"neu";
}
function detectIntent(t){
  const low=t.toLowerCase().trim();
  if(/^(hi|hello|hey|good morning|good afternoon|good evening|salut|bonjour)\b/.test(low))return"greet";
  if(/\b(bye|goodbye|see you|good night|à bientôt|au revoir)\b/.test(low))return"bye";
  if(/\b(thank you|thanks|merci)\b/.test(low))return"thanks";
  if(/\b(how are you|how r you|ça va)\b/.test(low))return"howare";
  if(/\b(what is your name|who are you|what's your name)\b/.test(low))return"who";
  if(/\b(help|aide|comment dire|how do you say|what does .* mean|how can i say)\b/.test(low))return"help";
  if(/^(yes|yeah|yep|oui|ok|okay|sure|of course|exactly)\b/.test(low))return"yes";
  if(/^(no|nope|nah|non|not really|not much)\b/.test(low))return"no";
  if(/^(i don't know|idk|dunno|no idea|je sais pas)\b/.test(low))return"idk";
  if(/\?$|^(what|where|when|who|why|how|do|does|did|is|are|can|could|would|will|have|has)\b/i.test(low))return"question";
  if(low.split(/\s+/).length<=2)return"short";
  return"statement";
}
function extractFacts(t){
  const f=MEM.facts;
  let m;
  if((m=t.match(/(?:my name is|i'?m|i am)\s+([A-Za-z]{2,})/i)))f.name=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();
  if((m=t.match(/(?:i(?:'?m| am) from|i live in)\s+([A-Za-z]{2,})/i)))f.place=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();
  if((m=t.match(/(?:i work|i'?m a|i am a)\s+([a-z ]{3,30})/i)))f.job=m[1].trim();
  if((m=t.match(/(?:i (?:really )?like|i love)\s+([a-z ]{2,30})/i))){
    const like=m[1].trim();if(like&&!f.likes.includes(like))f.likes.push(like);
  }
  const sent=detectSentiment(t);if(sent!=="neu")f.mood=sent;
}
function pickUnused(list){
  const avail=list.filter(x=>!MEM.asked.has(x[0]));
  if(!avail.length)return null;
  const x=pick(avail);
  MEM.asked.add(x[0]);
  return x;
}
function free(t){
  MEM.turn++;
  MEM.recent.push(t);if(MEM.recent.length>8)MEM.recent.shift();
  extractFacts(t);
  const intent=detectIntent(t);
  MEM.lastIntent=intent;
  const sent=detectSentiment(t);
  const lines=[];
  let chips=["Tell me more.","Not sure.","Something else."];

  // --- Special intents (no random question spam) ---
  if(intent==="greet"){
    return{lines:[pick([["Hey! Nice to see you.","Salut ! Content de te revoir."],["Hello! How’s it going?","Bonjour ! Ça va ?"],["Hi! Ready to chat a bit?","Salut ! Prêt(e) à discuter un peu ?"]])],
      ch:["I’m good, thanks.","A bit tired today.","Yes, let’s talk!"]};
  }
  if(intent==="bye"){
    return{lines:[["See you soon! Take care.","À bientôt ! Prends soin de toi."]],ch:["Bye, Emma!","See you tomorrow."]};
  }
  if(intent==="thanks"){
    return{lines:[pick([["You’re welcome!","De rien !"],["Happy to help.","Contente d’aider."],["Anytime.","Quand tu veux."]])],
      ch:["Can we keep talking?","Thanks again."]};
  }
  if(intent==="howare"){
    return{lines:[["I’m doing well, thanks for asking! How about you?","Je vais bien, merci de demander ! Et toi ?"]],
      ch:["I’m good.","A little tired.","I’m great today!"]};
  }
  if(intent==="who"){
    return{lines:[["I’m Emma, your English practice partner in DANSHA.","Je suis Emma, ta partenaire d’anglais dans DANSHA."]],
      ch:["Nice to meet you.","How long have you been here?"]};
  }
  if(intent==="help"){
    return{lines:[["Of course! Tell me the word or sentence and I’ll help.","Bien sûr ! Dis-moi le mot ou la phrase et je t’aide."]],
      ch:["How do you say…","What does this mean?"]};
  }

  // Soft grammar note (max one)
  const fx=FIX.find(f=>f[0].test(t));
  if(fx)lines.push(fx[1]);

  // Topic
  let topicKey=Object.keys(TOPICS).find(k=>TOPICS[k].re.test(t))||MEM.topic;
  const T=topicKey?TOPICS[topicKey]:null;
  if(topicKey)MEM.topic=topicKey;

  // Natural reaction (not always a question after)
  if(intent==="yes")lines.push(pick(REACT_YES));
  else if(intent==="no")lines.push(pick(REACT_NO));
  else if(intent==="idk")lines.push(pick(REACT_IDK));
  else if(intent==="short")lines.push(pick(REACT_SHORT));
  else if(T)lines.push(pick(T.react));
  else if(sent==="pos")lines.push(pick(REACT_POS));
  else if(sent==="neg")lines.push(pick(REACT_NEG));
  else lines.push(pick(REACT_NEU));

  // Decide whether to ask a follow-up (humans don't always ask)
  // Avoid asking if last turn already had a question, or short yes/no, or too many questions in a row
  let shouldAsk=true;
  if(intent==="yes"||intent==="no"||intent==="idk"||intent==="short")shouldAsk=MEM.noQStreak>=1&&Math.random()>.35;
  if(MEM.lastQ&&MEM.turn-MEM.lastQ<1)shouldAsk=false;
  if(MEM.noQStreak>=2)shouldAsk=true; // don't stay silent too long
  if(Math.random()<.22)shouldAsk=false; // sometimes just react

  let q=null;
  if(shouldAsk){
    // Prefer topic question, else generic, else vocab reuse
    if(T)q=pickUnused(T.ask);
    if(!q)q=pickUnused(GENERIC_ASK);
    if(!q&&MEM.turn%6===0){
      const known=ALLW.filter(p=>S.ok[p[0]]&&!MEM.asked.has("w:"+p[0]));
      if(known.length){
        const p=pick(known);
        MEM.asked.add("w:"+p[0]);
        q=["w:"+p[0],"Can you make a short sentence with “"+p[0]+"”?","Tu peux faire une petite phrase avec « "+p[0]+" » ?"];
        chips=[p[2]||"Let me try.","Hmm, not sure."];
      }
    }
    if(q){
      lines.push([q[1],q[2]]);
      MEM.lastQ=MEM.turn;
      MEM.noQStreak=0;
      if(T&&T.chips)chips=T.chips;
      else chips=["I’m not sure.","Let me think.","Something else."];
    }else{
      MEM.noQStreak++;
    }
  }else{
    MEM.noQStreak++;
    // Soft closer / continuer without question
    if(Math.random()>.5)lines.push(pick([["Tell me more if you want.","Raconte plus si tu veux."],["I’m listening.","Je t’écoute."],["Go on.","Continue."]]));
  }

  // Light personal touch using remembered facts (rare)
  if(MEM.facts.place&&MEM.turn%7===0&&Math.random()>.5&&!MEM.asked.has("fact_place")){
    MEM.asked.add("fact_place");
    lines.push(["By the way, how is life in "+MEM.facts.place+" these days?","Au fait, comment c’est la vie à "+MEM.facts.place+" en ce moment ?"]);
  }

  // Keep asked set from growing forever
  if(MEM.asked.size>40){
    const arr=[...MEM.asked];MEM.asked=new Set(arr.slice(-25));
  }

  // Default chips
  if(chips[0]==="Tell me more."&&T)chips=T.chips;
  if(chips[0]==="Tell me more.")chips=["I went out today.","I stayed home.","Not much, really."];

  return{lines,ch:chips};
}

const aiErr=e=>e.message==="401"?"Clé API refusée. Vérifiez-la.":e.message==="429"?"Trop de demandes, réessayez dans un instant.":e.name==="AbortError"?"Délai dépassé.":"IA indisponible : mode hors ligne.";
async function callAI(msgs,system,max){
  const sm=window.claude&&claude.use?await claude.use("sample"):null;if(!sm)throw new Error("sample");
  const txt=system+"\n\nConversation so far:\n"+msgs.map(m=>(m.role==="user"?"Learner: ":"Emma: ")+m.content).join("\n")+"\n\nWrite Emma's next reply now, in the required format.";
  const r=await sm(txt,{cache:false});return r.text}
const emmaSys=()=>`You are Emma, a warm, relaxed, slightly playful English conversation partner inside DANSHA Learning. The learner is a French speaker${S.level?" at level "+S.level:""}${S.name?", named "+S.name:""}. Speak like a real friendly person, not a robot or textbook. Keep replies SHORT (1–3 natural sentences). Adapt to their level. If they make a clear mistake, start with one short line “Better: …” then continue. Do NOT always ask a question — sometimes just react. Never repeat a question already asked. Be kind, curious, encouraging. When natural, reuse words they practiced: ${ALLW.filter(p=>S.ok[p[0]]).slice(0,8).map(p=>p[0]).join(", ")||"none yet"}.
Answer in EXACTLY this format:
<your English reply>
FR: <French translation of your reply>
REPLIES: <two short answers the learner could say, separated by |>`;
function parseAI(x){let ch=[];x=x.replace(/\n*REPLIES:\s*([^\n]*)\s*$/i,(_,r)=>{ch=r.split("|").map(s=>s.trim()).filter(Boolean).slice(0,3);return""});const p=x.split(/\n+FR:\s*/i);return{en:p[0].trim(),fr:(p[1]||"").trim(),ch}}
async function aiTurn(t){
  busy=true;chips([]);const ty=document.createElement("div");ty.className="b em2 ty";ty.innerHTML="<i></i><i></i><i></i>";if($("#msgs"))$("#msgs").append(ty);$("#main").scrollTop=1e5;
  const msgs=[];chat.slice(-14).forEach(c=>{const r=c.w==="em"?"assistant":"user",l=msgs[msgs.length-1];if(l&&l.role===r)l.content+="\n"+c.en;else msgs.push({role:r,content:c.en})});while(msgs.length&&msgs[0].role!=="user")msgs.shift();
  try{const o=parseAI(await callAI(msgs,emmaSys(),400));ty.remove();const c={w:"em",en:o.en,fr:o.fr};chat.push(c);if($("#msgs"))bubble(c);if(!S.silent)speak(o.en);busy=false;chat.cur=o.ch;if(tab==="talk")chips(o.ch)}
  catch(e){ty.remove();busy=false;toast(aiErr(e));const o=free(t);say(o.lines,o.ch)}
}
